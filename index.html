<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>my-service · 김재민의 API 서비스</title>
  <style>
    :root { --bg: #f5f6f8; --card: #fff; --line: #e4e6ea; --text: #1b1d22; --sub: #5c6270; --brand: #0066ff; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
      line-height: 1.5;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.02em; }
    .lead { color: var(--sub); margin: 0 0 24px; }
    .list { display: grid; gap: 12px; }
    a.card {
      display: block; padding: 20px; background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; color: inherit; text-decoration: none;
    }
    a.card:hover h2 { color: var(--brand); }
    a.card:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    a.card h2 { margin: 0 0 4px; font-size: 18px; }
    a.card p { margin: 0; color: var(--sub); font-size: 14px; }
    .api { margin-top: 8px; font-size: 12px; color: var(--sub); }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>my-service</h1>
    <p class="lead">공개 API와 공공데이터로 만든 작은 생활 서비스 모음이에요</p>
    <div class="list">
      <a class="card" href="commute.html">
        <h2>출근 도우미</h2>
        <p>역을 고르면 지금 이후 열차 3대와 서울 날씨·미세먼지를 한 화면에서 보여 줘요</p>
        <p class="api">🔌 공공데이터포털 서울교통공사 열차시간표 · Open-Meteo</p>
      </a>
    </div>
  </main>
</body>
</html>
